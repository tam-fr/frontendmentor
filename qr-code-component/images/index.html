<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />

    <title>Frontend Mentor | QR code component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
      img {
        border-radius: 1rem;
        width: 80%;
        height: 80%;
      }

      body {
        background-color: hsl(212, 45%, 89%);
      }

      .container {
        background-color: hsl(0, 0%, 100%);
        width: 300px;
        margin: 5rem auto;
        padding: 1.5rem;
        border-radius: 1rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="image-qr-code.png" alt="QR code" />
      <h2>Improve your front-end skills by building projects</h2>
      <p>
        Scan the QR code to visit Frontend Mentor and take your coding skills to
        the next level
      </p>
    </div>
    <footer class="attribution">
      <p>
        Challenge by
        <a
          href="https://www.frontendmentor.io/learning-paths/getting-started-on-frontend-mentor-XJhRWRREZd/challenge/65e6f48617e502f0b6ca3cfe/start"
          >Frontend Mentor</a
        >. Coded by
        <a href="https://www.frontendmentor.io/profile/tam-fr">Tam</a>.
      </p>
    </footer>
  </body>
</html>
