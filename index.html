<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">

    <title>Frontend Mentor | QR code component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
      img {
        display: block;
        border-radius: 1rem;
        width: 100%;
        max-width: 300px;
        height: auto;
        aspect-ratio: 1 / 1;
        margin-inline: auto;
      }
      .main {
        background-color: hsl(212, 45%, 89%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        border-radius: 1rem;
      }
      body {
        margin: 0;
        padding: 1rem;
        background-color: hsl(218, 44%, 22%);
        font-family: "Outfit", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;

        display: flex;
        align-items: center;
        justify-content: center;

        min-height: 100vh;
        min-height: 100dvh;
        text-align: center;
      }

      p {
        font-size: 0.9375rem;
      }
      h1 {
        font-size: 1.25rem;
        color: hsl(218, 44%, 22%);
      }
      .container {
        background-color: hsl(212, 45%, 89%);
        margin: 0;
        width: 98%;
        max-width: 320px;
        padding: 1.5rem;
        border-radius: 1rem;
        justify-content: center;
      }

      .text {
        color: hsl(220, 15%, 35%);
      }
    </style>
  </head>
  <body>
    <main class="main">
      <div class="container">
        <img src="images/image-qr-code.png" alt="QR code linking to the Frontend Mentor website">
        <h1>Improve your front-end skills by building projects</h1>
        <p class="text">
          Scan the QR code to visit Frontend Mentor and take your coding skills
          to the next level
        </p>
      </div>
      <footer class="attribution">
        <p>
          Challenge by
          <a
            href="https://www.frontendmentor.io/learning-paths/getting-started-on-frontend-mentor-XJhRWRREZd/challenge/65e6f48617e502f0b6ca3cfe/start"
            >Frontend Mentor</a
          >. Coded by
          <a href="https://www.frontendmentor.io/profile/tam-fr">Tam</a>.
        </p>
      </footer>
    </main>
  </body>
</html>
